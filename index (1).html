.btn-primary{background:var(--accent);color:#fff;font-weight:600}

.tag{display:inline-flex;align-items:center;gap:4px;padding:2px 8px;border-radius:99px;font-size:11px;font-weight:600;letter-spacing:0.04em}
.tag-push{background:var(--amber-dim);color:var(--amber)}
.tag-pull{background:var(--accent-dim);color:var(--accent)}

.tag-rest{background:var(--bg4);color:var(--text3)}
.card{background:var(--bg2);border:1px solid var(--border);border-radius:var(--r2);padding:16px}
.mono{font-family:var(--mono)}
#app{display:flex;flex-direction:column;min-height:100vh;min-height:100dvh;max-width:1100px;margin:0 auto}
.topbar{display:flex;align-items:center;gap:12px;padding:14px 16px;padding-top:calc(14px + var(--safe-top));border-bottom:1px solid var(--border);background:var(--bg);position:sticky;top:0;z-index:100}

  .grid4{grid-template-columns:1fr 1fr}

.stat-card{background:var(--bg3);border-radius:var(--r);padding:14px;border:1px solid var(--border)}

.section-header{display:flex;align-items:center;justify-content:space-between;margin-bottom:12px}

.modal{background:var(--bg2);border:1px solid var(--border2);border-radius:var(--r2) var(--r2) 0 0;padding:20px;width:100%;max-width:480px;max-height:85vh;overflow-y:auto;padding-bottom:calc(20px + var(--safe-bottom))}

.hm-0{background:var(--bg3)}.hm-1{background:#1d3a2a}.hm-2{background:#2a5c3e}.hm-3{background:#3d8d5f}.hm-4{background:var(--green)}
.bar-chart{display:flex;align-items:flex-end;gap:6px;height:120px;padding-top:10px}

.chip.active{background:var(--accent-dim);color:var(--accent);border-color:var(--accent)}

</style>
</head>
<body>
<div id="app"></div>
<script src="https://unpkg.com/react@18/umd/react.production.min.js"></script>
<script src="https://unpkg.com/react-dom@18/umd/react-dom.production.min.js"></script>
<script>

(function(){
  if('serviceWorker' in navigator){
    window.addEventListener('load',function(){
      var sw="const C='ppl-v1';self.addEventListener('install',e=>e.waitUntil(caches.open(C).then(c=>c.addAll(['./']))));self.addEventListener('fetch',e=>e.respondWith(caches.match(e.request).then(r=>r||fetch(e.request))));";
      var b=new Blob([sw],{type:'application/javascript'});
      navigator.serviceWorker.register(URL.createObjectURL(b)).catch(function(){});
    });
  }
  var m={name:"PPL Log",short_name:"PPL Log",display:"standalone",background_color:"#0f1011",theme_color:"#0f1011",start_url:"./",orientation:"portrait-primary",
    icons:[{src:ICON192,sizes:"192x192",type:"image/png",purpose:"any maskable"},{src:ICON512,sizes:"512x512",type:"image/png",purpose:"any maskable"}]};
  var l=document.createElement('link');l.rel='manifest';l.href=URL.createObjectURL(new Blob([JSON.stringify(m)],{type:'application/json'}));
  document.head.appendChild(l);
  var ai=document.createElement('link');ai.rel='apple-touch-icon';ai.href=ICON180;document.head.appendChild(ai);
  var ai2=document.createElement('link');ai2.rel='apple-touch-icon';ai2.setAttribute('sizes','152x152');ai2.href=ICON152;document.head.appendChild(ai2);
  var fi=document.createElement('link');fi.rel='icon';fi.type='image/png';fi.href=ICON192;document.head.appendChild(fi);
})();

var useState=React.useState,useEffect=React.useEffect,useRef=React.useRef,useMemo=React.useMemo;
var h=React.createElement;

var MCOL={Chest:'#528bff',Shoulders:'#a78bfa',Triceps:'#e8a94a',Back:'#4ec994',Biceps:'#e05252','Rear Delts':'#52c8e0',Quads:'#e8a94a',Hamstrings:'#e05252',Glutes:'#a78bfa',Calves:'#4ec994',Core:'#528bff'};

var PPL={
  'Push A':{tag:'push',exercises:[{name:'Barbell Bench Press',muscleGroup:'Chest',type:'compound',rest:90},{name:'Incline Dumbbell Press',muscleGroup:'Chest',type:'compound',rest:75},{name:'Overhead Press',muscleGroup:'Shoulders',type:'compound',rest:75},{name:'Single-Arm Cable Lateral Raise',muscleGroup:'Shoulders',type:'isolation',rest:45},{name:'Skull Crushers (EZ Bar)',muscleGroup:'Triceps',type:'isolation',rest:60},{name:'Overhead Tricep Extension',muscleGroup:'Triceps',type:'isolation',rest:45}]},
  'Pull A':{tag:'pull',exercises:[{name:'Deadlift / Romanian Deadlift',muscleGroup:'Back',type:'compound',rest:120},{name:'Weighted Pull-Up',muscleGroup:'Back',type:'compound',rest:90},{name:'Barbell / Cable Row',muscleGroup:'Back',type:'compound',rest:75},{name:'Face Pull',muscleGroup:'Rear Delts',type:'isolation',rest:45},{name:'Incline Dumbbell Curl',muscleGroup:'Biceps',type:'isolation',rest:45},{name:'Hammer Curl',muscleGroup:'Biceps',type:'isolation',rest:45}]},
  'Legs':{tag:'legs',exercises:[{name:'Barbell Back Squat',muscleGroup:'Quads',type:'compound',rest:120},{name:'Romanian Deadlift',muscleGroup:'Hamstrings',type:'compound',rest:90},{name:'Bulgarian Split Squat',muscleGroup:'Glutes',type:'compound',rest:75},{name:'Leg Press',muscleGroup:'Quads',type:'compound',rest:75},{name:'Leg Curl',muscleGroup:'Hamstrings',type:'isolation',rest:60},{name:'Standing Calf Raise',muscleGroup:'Calves',type:'isolation',rest:45}]},
  'Push B':{tag:'push',exercises:[{name:'Weighted Dips',muscleGroup:'Chest',type:'compound',rest:90},{name:'Incline Dumbbell Press',muscleGroup:'Chest',type:'compound',rest:75},{name:'Overhead Press',muscleGroup:'Shoulders',type:'compound',rest:75},{name:'Single-Arm Cable Lateral Raise',muscleGroup:'Shoulders',type:'isolation',rest:45},{name:'Tricep Rope Pushdown',muscleGroup:'Triceps',type:'isolation',rest:45},{name:'Overhead Tricep Extension',muscleGroup:'Triceps',type:'isolation',rest:45}]},
  'Pull B':{tag:'pull',exercises:[{name:'Deadlift / Romanian Deadlift',muscleGroup:'Back',type:'compound',rest:120},{name:'Weighted Pull-Up',muscleGroup:'Back',type:'compound',rest:90},{name:'Barbell / Cable Row',muscleGroup:'Back',type:'compound',rest:75},{name:'Face Pull',muscleGroup:'Rear Delts',type:'isolation',rest:45},{name:'Incline Dumbbell Curl',muscleGroup:'Biceps',type:'isolation',rest:45},{name:'Standing EZ Bar Curl',muscleGroup:'Biceps',type:'isolation',rest:45}]}
};

function uid(){return Math.random().toString(36).slice(2,9)}
function load(k,d){try{var v=localStorage.getItem(k);return v?JSON.parse(v):d}catch(e){return d}}
function save(k,v){try{localStorage.setItem(k,JSON.stringify(v))}catch(e){}}
function makeSet(){return{id:uid(),weight:'',reps:'',rpe:'',notes:'',done:false}}
function makeEx(t){return{id:uid(),name:t.name||'',muscleGroup:t.muscleGroup||'Chest',rest:t.rest||60,sets:[makeSet(),makeSet(),makeSet()]}}
function makeWorkout(tpl,date){
  var t=PPL[tpl]||{tag:'push',exercises:[]};
  return{id:uid(),date:date||new Date().toISOString().split('T')[0],template:tpl||'',tag:t.tag,sleep:'',protein:'',bodyweight:'',pain:'',notes:'',exercises:t.exercises.map(makeEx),completed:false,startTime:Date.now()};
}
function getPrev(ws,name,cid){
  for(var i=ws.length-1;i>=0;i--){
    if(ws[i].id===cid) continue;
    var ex=ws[i].exercises.find(function(e){return e.name===name});
    if(ex&&ex.sets.some(function(s){return s.weight||s.reps})) return ex.sets.filter(function(s){return s.done||s.weight||s.reps});
  }
  return null;
}
function getPRs(ws){
  var p={};
  ws.forEach(function(w){w.exercises.forEach(function(ex){ex.sets.forEach(function(s){
    if(!s.weight||!s.reps) return;
    var e1=parseFloat(s.weight)*(1+parseInt(s.reps)/30);
    if(!p[ex.name]||e1>p[ex.name]) p[ex.name]=e1;
  })})});
  return p;
}
function wkStart(d){var dt=new Date(d+'T12:00:00');var day=dt.getDay();var diff=dt.getDate()-day+(day===0?-6:1);return new Date(dt.setDate(diff)).toISOString().split('T')[0]}
function weeklyStats(ws){
  var m={};
  ws.forEach(function(w){
    var wk=wkStart(w.date);
    if(!m[wk]) m[wk]={sets:0,sessions:0,volume:0};
    m[wk].sessions++;
    w.exercises.forEach(function(ex){ex.sets.forEach(function(s){
      if(s.weight&&s.reps){m[wk].sets++;m[wk].volume+=parseFloat(s.weight)*parseInt(s.reps);}
    })});
  });
  return m;
}
function muscleMap(ws,days){
  var cut=new Date();cut.setDate(cut.getDate()-days);
  var m={};
  ws.forEach(function(w){
    if(new Date(w.date)<cut) return;
    w.exercises.forEach(function(ex){
      var c=ex.sets.filter(function(s){return s.done||s.weight||s.reps}).length;
      m[ex.muscleGroup]=(m[ex.muscleGroup]||0)+c;
    });
  });
  return m;
}
function totalSets(w){var t=0;w.exercises.forEach(function(ex){t+=ex.sets.filter(function(s){return s.done||s.weight||s.reps}).length});return t}
function totalVol(w){var v=0;w.exercises.forEach(function(ex){ex.sets.forEach(function(s){if(s.weight&&s.reps) v+=parseFloat(s.weight)*parseInt(s.reps)})});return Math.round(v)}

function exportData(){
  var d={workouts:load('wm_workouts',[]),exportedAt:new Date().toISOString(),version:1};
  var b=new Blob([JSON.stringify(d,null,2)],{type:'application/json'});
  var u=URL.createObjectURL(b);
  var a=document.createElement('a');a.href=u;a.download='ppl-log-'+new Date().toISOString().split('T')[0]+'.json';
  document.body.appendChild(a);a.click();document.body.removeChild(a);URL.revokeObjectURL(u);
}
function importData(file,onOK,onErr){
  var r=new FileReader();
  r.onload=function(e){
    try{
      var d=JSON.parse(e.target.result);
      if(!d.workouts||!Array.isArray(d.workouts)) throw new Error('Invalid format');
      save('wm_workouts',d.workouts);onOK(d.workouts.length);
    }catch(err){onErr(err.message)}
  };
  r.readAsText(file);
}

// ── TIMER ──
function Timer(props){
  var s=props.seconds,onDone=props.onDone;
  var rS=useState(s),rem=rS[0],setRem=rS[1];
  var rR=useState(true),running=rR[0],setRunning=rR[1];
  useEffect(function(){
    if(!running||rem<=0){if(rem<=0&&onDone) onDone();return}
    var t=setTimeout(function(){setRem(function(r){return r-1})},1000);
    return function(){clearTimeout(t)};
  },[rem,running]);
  var pct=(s-rem)/s*100;var m=Math.floor(rem/60);var sec=rem%60;
  var col=rem<=10?'var(--red)':rem<=30?'var(--amber)':'var(--green)';
  return h('div',{style:{textAlign:'center',padding:'8px 0'}},
    h('div',{className:'timer-display',style:{color:col}},m+':'+(sec<10?'0':'')+sec),
    h('div',{style:{height:'3px',background:'var(--bg4)',borderRadius:'3px',margin:'8px 0',overflow:'hidden'}},
      h('div',{style:{height:'100%',width:pct+'%',background:col,transition:'width 1s linear'}})),
    h('div',{style:{display:'flex',gap:'8px',justifyContent:'center'}},
      h('button',{className:'btn-ghost',style:{fontSize:'12px'},onClick:function(){setRunning(function(r){return !r})}},running?'Pause':'Resume'),
      h('button',{className:'btn-ghost',style:{fontSize:'12px',color:'var(--red)'},onClick:function(){setRem(0);if(onDone) onDone();}},'Skip')
    )
  );
}

// ── SET ROW ──
function SetRow(props){
  var set=props.set,idx=props.idx,prevSet=props.prevSet,onChange=props.onChange,onDone=props.onDone,prs=props.prs,exName=props.exName,exRest=props.exRest;
  var tS=useState(false),showT=tS[0],setShowT=tS[1];
  var e1rm=set.weight&&set.reps?parseFloat(set.weight)*(1+parseInt(set.reps)/30):0;
  var isPR=e1rm>0&&e1rm>=(prs[exName]||0)*0.99&&(prs[exName]||0)>0;
  function handleDone(){onDone();if(!set.done) setShowT(true)}
  return h('div',null,
    h('div',{className:'set-row'},
      h('div',{className:'set-num'},'S'+(idx+1)),
      h('input',{type:'number',placeholder:'lbs',value:set.weight,inputMode:'decimal',onChange:function(e){onChange(Object.assign({},set,{weight:e.target.value}))}}),
      h('input',{type:'number',placeholder:'reps',value:set.reps,inputMode:'numeric',onChange:function(e){onChange(Object.assign({},set,{reps:e.target.value}))}}),
      h('input',{type:'number',placeholder:'RPE',value:set.rpe,inputMode:'numeric',onChange:function(e){onChange(Object.assign({},set,{rpe:e.target.value}))}}),
      h('div',{className:'prev-val'},prevSet?h('span',null,(prevSet.weight||'-'),h('br'),(prevSet.reps?prevSet.reps+'r':'-')):'-'),
      h('input',{type:'text',placeholder:'note',value:set.notes,onChange:function(e){onChange(Object.assign({},set,{notes:e.target.value}))}}),
      h('button',{onClick:handleDone,style:{width:'30px',height:'30px',borderRadius:'50%',display:'flex',alignItems:'center',justifyContent:'center',background:set.done?'var(--green)':'var(--bg4)',border:'none',cursor:'pointer',color:set.done?'var(--bg)':'var(--text3)',flexShrink:0}},
        h('i',{className:'ti ti-check'}))
    ),
    isPR&&h('div',{style:{fontSize:'10px',color:'var(--amber)',textAlign:'right',padding:'2px 0',fontWeight:600}},'New PR estimate \uD83C\uDFC6'),
    showT&&h('div',{style:{background:'var(--bg3)',borderRadius:'var(--r)',padding:'8px',margin:'4px 0'}},
      h(Timer,{seconds:exRest||90,onDone:function(){setShowT(false)}}))
  );
}

// ── EXERCISE BLOCK ──
function ExBlock(props){
  var ex=props.ex,onChange=props.onChange,onDelete=props.onDelete,ws=props.ws,cid=props.cid,prs=props.prs;
  var cS=useState(false),col=cS[0],setCol=cS[1];
  var prev=getPrev(ws,ex.name,cid);
  function addSet(){onChange(Object.assign({},ex,{sets:ex.sets.concat([makeSet()])}))}
  function upd(i,s){var sets=ex.sets.slice();sets[i]=s;onChange(Object.assign({},ex,{sets:sets}))}
  function done(i){var sets=ex.sets.slice();sets[i]=Object.assign({},sets[i],{done:!sets[i].done});onChange(Object.assign({},ex,{sets:sets}))}
  var doneCnt=ex.sets.filter(function(s){return s.done}).length;
  var mgc=MCOL[ex.muscleGroup]||'var(--accent)';
  return h('div',{className:'exercise-block'},
    h('div',{className:'exercise-header',onClick:function(){setCol(function(c){return !c})}},
      h('div',{style:{width:'3px',height:'32px',borderRadius:'99px',background:mgc,flexShrink:0}}),
      h('div',{style:{flex:1}},
        h('div',{style:{fontWeight:600,fontSize:'14px'}},ex.name),
        h('div',{style:{fontSize:'11px',color:'var(--text3)',marginTop:'2px'}},ex.muscleGroup+(doneCnt>0?' · '+doneCnt+'/'+ex.sets.length+' done':''))
      ),
      prev&&h('div',{style:{fontSize:'11px',color:'var(--text3)',marginRight:'8px'}},prev[0]&&prev[0].weight?'Last: '+prev[0].weight+'lbs':''),
      h('button',{onClick:function(e){e.stopPropagation();onDelete()},style:{background:'none',border:'none',color:'var(--text3)',cursor:'pointer',padding:'4px',fontSize:'16px'}},h('i',{className:'ti ti-x'})),
      h('i',{className:'ti ti-chevron-'+(col?'right':'down'),style:{color:'var(--text3)',fontSize:'16px'}})
    ),
    !col&&h('div',{className:'exercise-body'},
      h('div',{style:{display:'grid',gridTemplateColumns:'28px 68px 68px 52px 46px 1fr 30px',gap:'5px',padding:'0 0 4px',borderBottom:'1px solid var(--border)',marginBottom:'4px'}},
        ['#','WEIGHT','REPS','RPE','PREV','NOTE',''].map(function(l,i){return h('div',{key:i,style:{fontSize:'10px',color:'var(--text3)',textAlign:i===0||i<5?'center':'left'}},l)})
      ),
      ex.sets.map(function(s,i){
        return h(SetRow,{key:s.id,set:s,idx:i,prevSet:prev&&prev[i],
          onChange:function(ns){upd(i,ns)},
          onDone:function(){done(i)},
          prs:prs,exName:ex.name,exRest:ex.rest});

        status&&h('div',{style:{marginTop:'8px',fontSize:'13px',color:status[0]==='\u2713'?'var(--green)':'var(--red)',padding:'8px',background:'var(--bg3)',borderRadius:'var(--r)'}},status)
      ),
      h('hr',{className:'div'}),
      h('div',null,
        h('div',{style:{fontWeight:600,fontSize:'14px',marginBottom:'4px'}},'Clear All Data'),
        h('div',{style:{fontSize:'12px',color:'var(--text3)',marginBottom:'8px'}},'Permanently delete all workout history. Export a backup first.'),
        h('button',{className:'btn-danger',style:{width:'100%',padding:'10px'},onClick:function(){
          if(confirm('Delete ALL workout data? This cannot be undone.')){setWs([]);localStorage.removeItem('wm_workouts');setStatus('')}
        }},'\u26A0\uFE0F Delete All Data')
      )
    ),
    h('div',{className:'card',style:{marginBottom:'12px'}},
      h('div',{className:'section-title',style:{marginBottom:'12px'}},'Install on iPhone / iPad'),
      h('div',{style:{display:'flex',gap:'12px',alignItems:'center',marginBottom:'12px'}},
        h('img',{id:'install-icon',style:{width:'52px',height:'52px',borderRadius:'12px',flexShrink:0},alt:'app icon'}),
        h('div',{style:{fontSize:'13px',color:'var(--text2)',lineHeight:'1.6'}},'Open in Safari, tap the Share button, then tap Add to Home Screen.')
      ),
      h('ol',{style:{paddingLeft:'20px',fontSize:'13px',color:'var(--text3)',lineHeight:'2'}},
        h('li',null,'Open this URL in Safari (not Chrome)'),
        h('li',null,'Tap the Share icon at the bottom of the screen (\uD83D\uDCE4)'),
        h('li',null,'Scroll and tap ',h('strong',{style:{color:'var(--text2)'}},'Add to Home Screen')),
        h('li',null,'Tap ',h('strong',{style:{color:'var(--text2)'}},'Add'),' \u2014 done')
      )
    ),
    h('div',{className:'card'},
      h('div',{className:'section-title',style:{marginBottom:'8px'}},'About'),
      h('div',{style:{fontSize:'13px',color:'var(--text3)',lineHeight:'1.8'}},
        'PPL Log v1.1',h('br'),'Designed for Will Marlow',h('br'),'5-Week Progressive Overload',h('br'),'All data stored locally on this device \u2014 no account needed.'
      )
    )
  );
}

// ── DASHBOARD VIEW ──
function DashView(props){
  var ws=props.ws,setView=props.setView,setActive=props.setActive;
  var today=new Date().toISOString().split('T')[0];
  var todayW=ws.find(function(w){return w.date===today});
  var wk=wkStart(today);
  var thisWk=ws.filter(function(w){return w.date>=wk});
  var mm=muscleMap(ws,7);
  var lastW=ws.length>0?ws[ws.length-1]:null;
  var prs=getPRs(ws);
  var ioS=useState(false),isIOS=ioS[0],setIsIOS=ioS[1];
  var stS=useState(false),isStd=stS[0],setIsStd=stS[1];
  useEffect(function(){
    setIsIOS(/iphone|ipad|ipod/i.test(navigator.userAgent));
    setIsStd(window.navigator.standalone===true||window.matchMedia('(display-mode: standalone)').matches);
    var el=document.getElementById('install-icon');if(el) el.src=ICON120;
  },[]);
  var streak=useMemo(function(){
    var s=0;var t=new Date();
    for(var i=0;i<30;i++){var d=new Date(t);d.setDate(d.getDate()-i);var k=d.toISOString().split('T')[0];if(ws.find(function(w){return w.date===k})) s++;else if(i>0) break;}
    return s;
  },[ws]);
  var sched=[{day:'Mon',type:'Push A',tag:'push'},{day:'Tue',type:'Pull A',tag:'pull'},{day:'Wed',type:'Legs',tag:'legs'},{day:'Thu',type:'REST',tag:'rest'},{day:'Fri',type:'Push B',tag:'push'},{day:'Sat',type:'Pull B',tag:'pull'},{day:'Sun',type:'Legs',tag:'legs'}];
  var dow=new Date().getDay();var dm=[6,0,1,2,3,4,5];var todaySch=sched[dm[dow]];
  var mmEntries=Object.entries(mm).sort(function(a,b){return b[1]-a[1]});
  var mmMax=mmEntries.length>0?Math.max.apply(null,mmEntries.map(function(m){return m[1]})):1;

  return h('div',null,
    isIOS&&!isStd&&h('div',{className:'ios-banner'},
      h('img',{src:ICON120,className:'ios-icon',alt:'icon'}),
      h('div',null,
        h('div',{style:{fontWeight:600,fontSize:'13px',marginBottom:'2px'}},'Add to Home Screen'),
        h('div',{style:{fontSize:'12px',color:'var(--text3)'}},'Tap \uD83D\uDCE4 Share \u2192 Add to Home Screen in Safari for the full app experience.')
      )
    ),
    h('div',{style:{marginBottom:'20px'}},
      h('h2',{style:{fontSize:'20px',marginBottom:'4px'}},'Hey Will \uD83D\uDC4B'),
      h('div',{style:{fontSize:'13px',color:'var(--text3)'}},new Date().toLocaleDateString('en-US',{weekday:'long',month:'long',day:'numeric'}))
    ),
    h('div',{className:'grid4',style:{marginBottom:'20px'}},
      h('div',{className:'stat-card'},h('div',{className:'stat-val',style:{color:'var(--green)'}},thisWk.length),h('div',{className:'stat-label'},'This week'),h('div',{className:'stat-sub'},'of 6 sessions')),
      h('div',{className:'stat-card'},h('div',{className:'stat-val',style:{color:'var(--amber)'}},streak),h('div',{className:'stat-label'},'Streak'),h('div',{className:'stat-sub'},'days')),
      h('div',{className:'stat-card'},h('div',{className:'stat-val'},ws.length),h('div',{className:'stat-label'},'Total sessions'),h('div',{className:'stat-sub'},Object.keys(prs).length+' PRs tracked')),
      h('div',{className:'stat-card'},h('div',{className:'stat-val',style:{color:'var(--purple)'}},thisWk.reduce(function(s,w){return s+totalVol(w)},0).toLocaleString()),h('div',{className:'stat-label'},'Week volume'))
    ),
    h('div',{className:'grid2',style:{marginBottom:'16px'}},
      h('div',{className:'card'},
        h('div',{className:'section-header',style:{marginBottom:'12px'}},
          h('div',{className:'section-title'},"Today"),
          todayW&&h('span',{style:{fontSize:'12px',color:'var(--green)'}},'Done \u2713')
        ),
        todaySch.tag==='rest'
          ?h('div',{style:{textAlign:'center',padding:'12px',color:'var(--text3)'}},h('i',{className:'ti ti-zzz',style:{fontSize:'28px',display:'block',marginBottom:'8px'}}),'\uD83D\uDE34 Rest & Recovery')
          :h('div',null,
            h('div',{style:{display:'flex',gap:'8px',alignItems:'center',marginBottom:'12px'}},
              h('span',{className:'tag tag-'+todaySch.tag},todaySch.tag.toUpperCase()),
              h('span',{style:{fontWeight:600,fontSize:'15px'}},todaySch.type)
            ),
            !todayW&&h('button',{className:'btn-primary',
              onClick:function(){setActive(makeWorkout(todaySch.type,today));setView('log')},
              style:{width:'100%',padding:'10px',display:'flex',alignItems:'center',justifyContent:'center',gap:'6px'}},
              h('i',{className:'ti ti-player-play',style:{fontSize:'16px'}}),'Start '+todaySch.type),
            todayW&&h('div',{style:{display:'flex',gap:'16px',fontSize:'13px'}},
              h('div',null,h('span',{style:{color:'var(--text3)'}},'Sets: '),totalSets(todayW)),
              h('div',null,h('span',{style:{color:'var(--text3)'}},'Vol: '),totalVol(todayW).toLocaleString()+'lbs')
            )
          )
      ),
      h('div',{className:'card'},
        h('div',{className:'section-header'},h('div',{className:'section-title'},'Schedule')),
        h('div',{style:{display:'flex',gap:'3px'}},
          sched.map(function(s,i){
            var isTod=dm[dow]===i;
            return h('div',{key:i,style:{flex:1,textAlign:'center',padding:'5px 2px',borderRadius:'var(--r)',background:isTod?'var(--bg4)':'transparent',border:isTod?'1px solid var(--border2)':'1px solid transparent'}},
              h('div',{style:{fontSize:'9px',color:isTod?'var(--accent)':'var(--text3)',fontWeight:isTod?700:400,marginBottom:'3px'}},s.day),
              h('span',{className:'tag tag-'+s.tag,style:{fontSize:'8px',padding:'1px 3px'}},s.tag==='rest'?'R':s.tag[0].toUpperCase())
            );
          })
        )
      )
    ),
    h('div',{className:'grid2'},
      h('div',{className:'card'},
        h('div',{className:'section-header'},h('div',{className:'section-title'},'Muscle Sets \u2014 7d')),
        mmEntries.length===0
          ?h('div',{style:{color:'var(--text3)',fontSize:'12px',padding:'8px'}},'Log workouts to see data')
          :mmEntries.map(function(m){
            return h('div',{key:m[0],className:'mini-bar-row'},
              h('div',{style:{width:'75px',fontSize:'12px',color:'var(--text2)',flexShrink:0}},m[0]),
              h('div',{className:'mini-bar-bg'},h('div',{className:'mini-bar-fill',style:{width:(m[1]/mmMax*100)+'%',background:MCOL[m[0]]||'var(--accent)'}})),
              h('div',{style:{fontSize:'11px',fontFamily:'var(--mono)',color:'var(--text3)',minWidth:'20px',textAlign:'right'}},m[1])
            );
          })
      ),
      lastW
        ?h('div',{className:'card'},
          h('div',{className:'section-header'},h('div',{className:'section-title'},'Last \u2014 '+lastW.template)),
          h('div',{style:{fontSize:'12px',color:'var(--text3)',marginBottom:'10px'}},lastW.date),
          h('div',{className:'grid2',style:{marginBottom:'10px'}},
            h('div',null,h('div',{className:'stat-val'},totalSets(lastW)),h('div',{className:'stat-label'},'Sets')),
            h('div',null,h('div',{className:'stat-val'},(totalVol(lastW)/1000).toFixed(1)+'k'),h('div',{className:'stat-label'},'Vol lbs'))
          ),
          lastW.sleep&&h('div',{style:{fontSize:'12px',color:parseFloat(lastW.sleep)>=8?'var(--green)':'var(--amber)',marginBottom:'4px'}},'\uD83D\uDCA4 ',lastW.sleep,'h sleep'),
          lastW.protein&&h('div',{style:{fontSize:'12px',color:'var(--text2)'}},'\uD83E\uDD69 ',lastW.protein,'g protein')
        )
        :h('div',{className:'card'},h('div',{className:'empty-state'},h('i',{className:'ti ti-barbell'}),h('p',null,'Start logging to see stats')))
    )
  );
}

// ── APP ROOT ──
function App(){
  var wS=useState(function(){return load('wm_workouts',[])});
  var ws=wS[0],setWsRaw=wS[1];
  var vS=useState('dashboard'),view=vS[0],setView=vS[1];
  var aS=useState(null),active=aS[0],setActive=aS[1];
  function setWs(fn){setWsRaw(function(prev){var next=typeof fn==='function'?fn(prev):fn;save('wm_workouts',next);return next})}
  var nav=[{id:'dashboard',icon:'ti-home',label:'Home'},{id:'log',icon:'ti-barbell',label:'Log'},{id:'history',icon:'ti-history',label:'History'},{id:'reports',icon:'ti-chart-bar',label:'Reports'},{id:'settings',icon:'ti-settings',label:'Settings'}];
  return h('div',{id:'app'},
    h('div',{className:'topbar'},
      h('h1',null,'\u26A1 PPL LOG'),
      h('div',{className:'nav'},
        nav.map(function(n){
          return h('button',{key:n.id,className:'nav'+(view===n.id?' active':''),onClick:function(){setView(n.id)}},
            h('i',{className:'ti '+n.icon,style:{fontSize:'17px'}}),
            h('span',null,n.label)
          );
        })
      )
    ),
    h('div',{className:'content'},
      view==='dashboard'&&h(DashView,{ws:ws,setView:setView,setActive:setActive}),
      view==='log'&&h(LogView,{ws:ws,setWs:setWs,active:active,setActive:setActive}),
      view==='history'&&h(HistoryView,{ws:ws,setWs:setWs}),
      view==='reports'&&h(ReportsView,{ws:ws}),
      view==='settings'&&h(SettingsView,{ws:ws,setWs:setWs})
    )
  );
}
ReactDOM.createRoot(document.getElementById('app')).render(h(App,null));
</script>
